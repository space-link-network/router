# /etc/lighttpd/conf.d/space-link.conf
# Включается из главного lighttpd.conf через include "conf.d/*.conf".
#
# Установщик подменяет __PANEL_IP__ и __PANEL_PORT__ реальными значениями:
# либо alias-IP (если поднялся), либо основной IP роутера (fallback при
# выключенном uhttpd).

server.bind = "__PANEL_IP__"
server.port = __PANEL_PORT__

server.modules += ( "mod_proxy", "mod_rewrite", "mod_redirect" )

$HTTP["host"] =~ "^(my\.spacelink|.*)$" {
    server.document-root = "/opt/space-link/www"
    index-file.names      = ( "index.html" )

    # API → backend на loopback
    $HTTP["url"] =~ "^/api/" {
        proxy.server = ( "" => (
            ( "host" => "127.0.0.1", "port" => 8080 )
        ))
    }

    # SPA fallback: всё, кроме /api/ и существующих файлов, отдаём index.html
    url.rewrite-if-not-file = ( "^/(?!api/)(.*)$" => "/index.html" )
}

server.tag = "space-link"
